name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: syntax
        run: python -m compileall -q cli_edvibe
      - name: offline tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[branding]" pytest
          python -m pytest cli_edvibe/tests/test_core.py \
                           cli_edvibe/tests/test_homework_spec.py \
                           cli_edvibe/tests/test_folders_dump.py \
                           cli_edvibe/tests/test_landing.py \
                           cli_edvibe/tests/test_school.py \
                           cli_edvibe/tests/test_test_english.py \
                           cli_edvibe/tests/test_asr.py \
                           cli_edvibe/tests/test_homework_answers.py \
                           cli_edvibe/tests/test_book_branding.py -q
      - name: license drift
        run: |
          test -f LICENSE || { echo "LICENSE missing"; exit 1; }
          grep -qiE 'Apache License|MIT License' LICENSE || { echo "unexpected LICENSE"; exit 1; }
          grep -q 'License:' README.md || { echo "README has no license badge"; exit 1; }
